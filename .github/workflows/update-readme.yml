name: Update README

# Uma vez por dia o README confere as releases dos repositórios e atualiza a
# coluna "Latest" e o total. Só faz commit se algo mudou.
on:
  schedule:
    - cron: "17 10 * * *"   # 07:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_readme.py
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar releases no README
        run: python scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, se mudou
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "readme: releases atualizadas"
          git push
